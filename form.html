<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Реєстрація</h1>
        <form id="form">
            <label>Ім'я</label>
            <input type="text" id="name">
            <div class="error" id="nameError">Введіть ім'я</div>

            <label>Email</label>
            <input type="email" id="email">
            <div class="error" id="emailError">Введіть правильний email</div>

            <label>Пароль</label>
            <input type="password" id="password">
            <div class="error" id="passwordError">Мінімум 6 символів</div>

            <label>Повтор пароля</label>
            <input type="password" id="confirmPassword">
            <div class="error" id="confirmError">Паролі не співпадають</div>

            <button type="submit">Зареєструватися</button>
            <div class="success" id="success">Форма успішно відправлена!</div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
